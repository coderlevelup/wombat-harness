[project]
name = "wombat-harness"
version = "0.1.0"
description = "Harness for generating Python code with a small local model, validated with pydantic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
tui = ["textual>=0.80"]
pydantic-ai = ["pydantic-ai-slim[openai]>=2"]
dev = ["pytest", "pytest-asyncio", "textual>=0.80", "pydantic-ai-slim[openai]>=2"]

[project.scripts]
wombat = "wombat_harness.cli:main"
wombat-agent = "wombat_harness.agent.cli:main"
wombat-tui = "wombat_harness.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wombat_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
